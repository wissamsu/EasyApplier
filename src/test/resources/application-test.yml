spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    mongodb:
      uri: mongodb://localhost:27017/testdb
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

jwt:
  secret: dGVzdHNlY3JldGtleXRoYXRpc2F0bGVhc3QyNTZiaXRzbG9uZ2Zvcm1lbnRhdGlvbjEyMzQ1
  expiration: 86400000

cloudinary:
  cloud:
    name: test-cloud
  api:
    key: test-key
    secret: test-secret

local:
  host:
    url: http://localhost:3000
backend:
  host:
    url: http://localhost:8080
frontend:
  host:
    url: http://localhost:3000

spring.flyway.enabled: false
